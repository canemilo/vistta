name = "vistta-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Crea la base con `pnpm db:create` y pega aquí el database_id que te devuelva.
[[d1_databases]]
binding = "DB"
database_name = "vistta"
database_id = "REEMPLAZA_CON_TU_D1_ID"
migrations_dir = "migrations"

# Almacenamiento de medios (crea el bucket con `wrangler r2 bucket create vistta-media`)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vistta-media"

# BASE_URL como var pública; PANEL_TOKEN va como secreto: `wrangler secret put PANEL_TOKEN`
[vars]
BASE_URL = "http://localhost:8787"
