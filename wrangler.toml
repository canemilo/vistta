name = "vistta-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Crea la base con `pnpm db:create` y pega aquí el database_id que te devuelva.
[[d1_databases]]
binding = "DB"
database_name = "vistta"
database_id = "REEMPLAZA_CON_TU_D1_ID"
migrations_dir = "migrations"

# Almacenamiento de medios (crea el bucket con `wrangler r2 bucket create vistta-media`)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vistta-media"

# BASE_URL es var pública. Los secretos NUNCA van aquí; se cargan con:
#   wrangler secret put PANEL_PIN
#   wrangler secret put PANEL_TOKEN
#   wrangler secret put MEDIA_SIGNING_KEY
[vars]
# Origen del viewer: es la base de los enlaces /v/:token que genera el panel.
BASE_URL = "http://localhost:4200"
