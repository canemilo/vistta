<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 170" role="img" aria-label="Vistta">
  <title>Vistta</title>
  <defs>
    <linearGradient id="nodo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38a3dd"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="estela" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- La estela de la última letra: sube hacia la derecha, como en la marca. -->
  <path d="M340 132 L364 46 L388 46 L364 132 Z" fill="url(#estela)"/>

  <!-- «vıstta» con la i sin punto: el punto lo pone el nodo de abajo. -->
  <text x="20" y="132"
        font-family="'Poppins','Montserrat','Avenir Next','Century Gothic','Futura','Nunito Sans',system-ui,sans-serif"
        font-size="140" font-weight="600" letter-spacing="-4" fill="#e6f4f1">vıstta</text>

  <!-- El nodo sobre la i. Es el mismo punto que abre el enlace en la marca. -->
  <circle cx="128" cy="44" r="16" fill="url(#nodo)"/>
</svg>
