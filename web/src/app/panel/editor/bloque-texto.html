@if (seccion().type !== 'galeria') {
  <textarea
    rows="4"
    [value]="$any(seccion()).body ?? ''"
    (input)="perfil.editarSeccion(si(), $any({ body: $any($event.target).value }))"
    placeholder="Escribe aquí. Una línea en blanco separa párrafos."
    [attr.aria-label]="'Texto del bloque ' + (si() + 1)"
    [attr.maxlength]="TOPE"
    class="mt-3 w-full resize-y rounded-lg border border-borde bg-sup-2 px-3 py-2.5 font-serif text-[15px] leading-[1.7] text-texto outline-none placeholder:text-texto-3 focus:border-acento/60"
  ></textarea>
  <!-- El contador solo aparece cerca del tope: enseñar «12 de 5.000» desde la
       primera letra es ruido, y el tope no es una meta. -->
  @if (escrito() > TOPE * 0.8) {
    <p class="mt-1 text-right font-mono text-[10px] text-texto-3">
      {{ escrito() }} de {{ TOPE }} caracteres
    </p>
  }
}
