<!--
  Barra del panel.
  ============================================================================
  Ordenada por lo que se hace más veces, no por lo que es más fácil de
  colocar. A la izquierda el CONTEXTO —quién eres y qué perfil estás
  tocando—; a la derecha las ACCIONES, y de ellas solo dos a la vista: ver
  como el cliente, que es a lo que se viene, y salir. El resto vive en un
  desplegable, porque cambiar de plan o de contraseña se hace dos veces al
  año y no merece ocupar sitio los otros trescientos sesenta y tres días.

  El desplegable es `<details>` nativo, como la ampliación de foto es
  `<dialog>`: se abre con el teclado, se cierra con Escape y no arrastra ni
  una línea de JavaScript.
-->
<header class="border-b border-borde-2 py-4">
  <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3">
    <!-- Contexto -->
    <div class="flex min-w-0 items-center gap-3">
      <app-marca [alto]="34" class="shrink-0 text-titulo" />
      <span class="hidden h-6 w-px bg-borde sm:block" aria-hidden="true"></span>
      <!--
        `ngModel` y no `[value]`: con `[value]`, un perfil recién creado se
        selecciona en el componente pero el desplegable se queda enseñando
        el anterior, porque su `<option>` todavía no existía cuando se
        escribió el valor. El cliente veía el editor del perfil nuevo y el
        nombre del viejo en la misma pantalla.
      -->
      <select
        [ngModel]="perfil.perfilId()"
        (ngModelChange)="acciones.elegirPerfil($event)"
        name="perfilElegido"
        aria-label="Perfil que se está editando"
        class="min-w-0 max-w-[15rem] truncate rounded-lg border border-borde bg-sup-2 px-3 py-1.5 font-mono text-[12px] text-texto outline-none focus:border-acento/60"
      >
        <!--
          La REFERENCIA va con el nombre, y no es adorno: es como el agente
          llama de verdad a un inmueble. Se escribía en la ficha y no volvía a
          verse en ninguna pantalla de trabajo, así que con cuatro dosieres
          llamados «Piso centro» había que abrirlos para saber cuál era cuál.
        -->
        @for (p of cuenta.perfiles(); track p.id) {
          <option [value]="p.id" [disabled]="p.status === 'congelado'">
            {{ p.displayName }}{{ p.referencia ? ' · ' + p.referencia : ''
            }}{{ p.status === 'congelado' ? ' · congelado' : '' }}
          </option>
        }
      </select>

      <!-- Crear un perfil. El plan da 1, 3 o 10; hasta que se añadió esto,
           toda cuenta se quedaba con el que se crea al darla de alta. -->
      <button
        type="button"
        (click)="acciones.creando.set(!acciones.creando()); acciones.errorPerfil.set('')"
        [disabled]="!cuenta.puedeCrearPerfil()"
        [attr.aria-expanded]="acciones.creando()"
        [title]="
          cuenta.puedeCrearPerfil()
            ? 'Crear un perfil nuevo'
            : 'Tu plan no da para más perfiles activos'
        "
        class="shrink-0 rounded-lg border border-borde px-3 py-1.5 font-mono text-[11px] tracking-[0.16em] text-texto-2 hover:border-acento/60 hover:text-acento disabled:opacity-40 disabled:hover:border-borde disabled:hover:text-texto-2"
      >
        + PERFIL
      </button>
    </div>

    <!-- Acciones -->
    <div class="flex flex-wrap items-center gap-2">
      <button
        type="button"
        (click)="verComoElCliente.emit()"
        class="rounded-lg border border-acento/50 bg-acento/10 px-3.5 py-2 font-mono text-[11px] tracking-[0.16em] text-acento hover:border-acento"
      >
        VER COMO EL CLIENTE
      </button>

      <details class="relative" #menuCuenta>
        <summary
          class="cursor-pointer list-none rounded-lg border border-borde px-3.5 py-2 font-mono text-[11px] tracking-[0.16em] text-texto-2 marker:content-none hover:border-acento/60 hover:text-acento"
        >
          CUENTA ▾
        </summary>
        <div
          class="absolute right-0 z-30 mt-2 w-[15rem] rounded-xl border border-borde bg-sup p-2 shadow-[0_18px_40px_-18px_rgba(0,0,0,0.55)]"
        >
          <p class="px-2 py-1.5 font-mono text-[10px] tracking-[0.2em] text-texto-3 uppercase">
            {{ cuenta.plan()?.nombre ?? 'sin plan' }} · {{ cuenta.uso().perfilesActivos }} de
            {{ cuenta.topePerfiles() ?? '∞' }} perfiles
          </p>
          <p class="px-2 pb-2 font-mono text-[10px] text-texto-3">
            {{ cuenta.uso().pasesAbiertos }} pases abiertos
          </p>
          <div class="my-1 h-px bg-borde-2" aria-hidden="true"></div>
          <!--
            La actividad de la cartera. Va aquí y no como pestaña del panel
            porque no hace falta para montar un dosier ni para mandar un
            enlace: se mira por la mañana, con el café.
          -->
          <a
            routerLink="/panel/integracion"
            class="block w-full rounded-lg px-2 py-2 text-left font-mono text-[11px] tracking-[0.14em] text-texto-2 hover:bg-sup-2 hover:text-acento"
          >
            CONECTAR CON TU CRM
          </a>
          <a
            routerLink="/panel/actividad"
            class="block w-full rounded-lg px-2 py-2 text-left font-mono text-[11px] tracking-[0.14em] text-texto-2 hover:bg-sup-2 hover:text-acento"
          >
            ACTIVIDAD Y AVISOS
          </a>
          <button
            type="button"
            (click)="cuenta.miCuenta.set(!cuenta.miCuenta()); menuCuenta.open = false"
            class="block w-full rounded-lg px-2 py-2 text-left font-mono text-[11px] tracking-[0.14em] text-texto-2 hover:bg-sup-2 hover:text-acento"
          >
            MI PERFIL
          </button>
          <button
            type="button"
            (click)="cuenta.viendoPlanes.set(!cuenta.viendoPlanes()); menuCuenta.open = false"
            class="block w-full rounded-lg px-2 py-2 text-left font-mono text-[11px] tracking-[0.14em] text-texto-2 hover:bg-sup-2 hover:text-acento"
          >
            CAMBIAR DE PLAN
          </button>
          <button
            type="button"
            (click)="cuenta.cambiandoClave.set(!cuenta.cambiandoClave()); menuCuenta.open = false"
            class="block w-full rounded-lg px-2 py-2 text-left font-mono text-[11px] tracking-[0.14em] text-texto-2 hover:bg-sup-2 hover:text-acento"
          >
            CAMBIAR CONTRASEÑA
          </button>
        </div>
      </details>

      <app-boton-tema />

      <!-- Salir. Faltaba: se podía entrar y no había forma de cerrar la
           sesión, que en un ordenador compartido no es un detalle. -->
      <button
        type="button"
        (click)="acciones.salir()"
        class="rounded-lg border border-borde px-3.5 py-2 font-mono text-[11px] tracking-[0.16em] text-texto-2 hover:border-peligro/60 hover:text-peligro"
      >
        SALIR
      </button>
    </div>
  </div>
</header>
