name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres de verdad, no un doble: los invariantes del producto (el consumo
    # atómico del pase) son de concurrencia y un motor monohilo los daría por
    # buenos aunque estuvieran mal. GitHub lo da como servicio, gratis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vistta
          POSTGRES_PASSWORD: vistta
          POSTGRES_DB: vistta_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vistta -d vistta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://vistta:vistta@localhost:5433/vistta_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --dir web run build
      # El runner de ubuntu ya trae Chrome; Karma lo encuentra en el PATH.
      - run: pnpm --dir web run test:ci

  # Las imágenes se construyen en cada cambio, no solo al desplegar. Es lo que
  # detecta que una dependencia nativa dejó de compilar, que el bundle de
  # producción no arranca o que faltan las fuentes de la marca de agua: la
  # comprobación de fuentes corre DENTRO de la construcción y la tumba.
  imagenes:
    runs-on: ubuntu-latest

    # La API no arranca sin base, y es a propósito: una API que no llega a su
    # base no sirve. Para comprobar que la imagen ARRANCA hay que darle una.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vistta
          POSTGRES_PASSWORD: vistta
          POSTGRES_DB: vistta
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vistta -d vistta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vistta-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen del panel y el viewer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: vistta-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Que construya no basta: tiene que ARRANCAR. Un binario nativo que no
      # carga, un bundle mal hecho o una migración rota solo aparecen aquí.
      - name: La imagen migra y sirve
        env:
          DATABASE_URL: postgresql://vistta:vistta@127.0.0.1:5434/vistta
        run: |
          set -euo pipefail
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            vistta-api:ci node dist/migrar.js

          docker run -d --name api-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e MEDIA_SIGNING_KEY="$(head -c 32 /dev/urandom | base64)" \
            -e BASE_URL='https://ci.example' \
            -e STORAGE_DRIVER=memory \
            vistta-api:ci

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8787/health; then echo; exit 0; fi
            sleep 2
          done
          echo "La API no respondió en /health"; docker logs api-ci; exit 1
