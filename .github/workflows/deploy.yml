name: Deploy

# Solo manual: el deploy no se dispara con los push a main.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Los secretos del Worker (PANEL_PIN, PANEL_TOKEN, MEDIA_SIGNING_KEY) se cargan
    # con `wrangler secret put` y NUNCA viven en el repo.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Aplicar migraciones D1
        run: pnpm exec wrangler d1 migrations apply vistta --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Desplegar Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
